<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="安幸上工">
  <!--
    ★ 跟 gen-icons.py 是**同一組幾何與顏色**。改了那支就要改這支 ——
      兩邊分岔的話,SVG 用在哪裡就會出現一個跟 PNG 不一樣的記號,
      而那種不一致只有把兩個擺在一起才看得出來。
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EEE3"/><stop offset="1" stop-color="#E8E0CE"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#355977"/><stop offset="1" stop-color="#1C3348"/>
    </linearGradient>
    <!-- 遠端的洞要被近端的洞裁掉,不然位移出去的部分會蓋到牆上 -->
    <clipPath id="near"><path d="M144 512V240a112 112 0 0 1 224 0v272z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#wall)"/>
  <!-- 內壁：近端的洞整個填中間調 -->
  <path d="M144 512V240a112 112 0 0 1 224 0v272z" fill="#6E8CA8"/>
  <!-- 洞裡：遠端的洞往右下位移 40/30，裁進近端 -->
  <g clip-path="url(#near)">
    <path d="M184 512V270a112 112 0 0 1 224 0v242z" fill="url(#hole)"/>
  </g>
</svg>
