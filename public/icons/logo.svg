<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 428" width="326" height="428" role="img" aria-label="安幸上工">
  <title>安幸上工 標誌</title>
  <desc>一扇拱形的門，門板右側有一個圓形門把。幾何：外框 326×428、線寬 22、拱中心線半徑 151.5、門把圓心 (240, 305) 半徑 21。門把偏右不置中 —— 門把本來就在門邊，置中會先被讀成「一個點」再被讀成門把。</desc>
  <g fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="butt">
    <path d="M11 428 V162.5 A151.5 151.5 0 0 1 315 162.5 V428" />
  </g>
  <circle cx="240" cy="305" r="21" fill="currentColor" />
</svg>
