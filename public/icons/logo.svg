<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="安幸上工">
  <title>安幸上工 標誌</title>
  <desc>一扇拱形的門，門板填滿紅木色的垂直漸層（上淺下深，像光從上面來），右側有一個挖空的圓形門把。門板佔畫布約 62%，並往上移做視覺置中 —— 門是上輕下重的形狀，幾何置中會看起來偏低。門把偏右不置中：門把本來就在門邊，置中會先被讀成「一個點」再被讀成門把。</desc>
  <defs>
    <linearGradient id="anxing-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F0EADC"/>
    </linearGradient>
    <linearGradient id="anxing-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A05B44"/>
      <stop offset="1" stop-color="#54291D"/>
    </linearGradient>
    <mask id="anxing-handle">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="331" cy="303" r="18" fill="#000"/>
    </mask>
  </defs>
  <!-- 底色滿版、不透明、無圓角 —— 圓角由系統切（Apple HIG） -->
  <rect width="512" height="512" fill="url(#anxing-bg)"/>
  <path d="M136 396 V206 A120 120 0 0 1 376 206 V396 Z"
        fill="url(#anxing-door)" mask="url(#anxing-handle)"/>
</svg>
