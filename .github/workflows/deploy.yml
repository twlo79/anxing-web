name: Deploy to Vultr
on:
  push:
    branches: [main]

# ── 一次只准跑一個部署（2026-08-25 加，起因是 #396）──────────
#
# #396 的症狀:compile 成功了，下一階段卻說
#     ENOENT: .next/build-manifest.json
# 那個檔案是 compile 自己剛剛產生的。
#
# 原因是**兩個部署同時在同一台主機上跑**。連續推兩次 commit 就會
# 開兩個 job，而腳本裡有一行 `rm -rf .next` ——
# 後面那個 job 把前面那個剛編好的東西刪掉了。
#
# ★ `cancel-in-progress: false` —— **不能取消進行中的那個**。
#   取消的話 SSH 連線斷開，主機上的 next build 變成沒人管的孤兒程序，
#   而 rollback 那段永遠不會執行:原始碼已經換成新的、.next 只寫了一半、
#   pm2 還在跑舊程序。那正是 2026-08-04 全站 503 的形狀。
#   排隊等它跑完才是對的。
concurrency:
  group: deploy-vultr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -u
            cd /opt/anxing-web

            # ── 主機端也上一道鎖（2026-08-25）────────────────────
            #
            # 上面的 `concurrency:` 只管得住 GitHub 這邊排隊。
            # 「Re-run jobs」、手動 SSH 進來跑、或哪天多一個 workflow，
            # 都還是會有兩個 build 同時在這台機器上動同一個 .next。
            #
            # 症狀不會是「衝突」，是**檔案憑空不見**:
            # #396 compile 明明成功了，下一步卻說 build-manifest.json 不存在——
            # 那是另一個 job 的 `rm -rf .next` 幹的。
            #
            # ★ 用 `-w` 等而不是 `-n` 直接放棄 —— 排在後面的那次推送
            #   本來就該部署，放棄的話那個 commit 永遠不會上線，
            #   而 Actions 只顯示一個看不懂的失敗。
            # ★ 600 秒要小於 command_timeout（15m），
            #   不然等到超時是 SSH 斷線，鎖也跟著沒了。
            exec 9>/tmp/anxing-deploy.lock
            if ! flock -w 600 9; then
              echo "!! 另一個部署佔用超過 10 分鐘，這次不動它。稍後重跑。"
              exit 1
            fi

            # 用 fetch + reset --hard 而不是 git pull。
            # 原因:npm install 會改寫 package-lock.json,主機上一旦有本機修改,
            # git pull 就會以「本機變更會被覆蓋」為由中止,整個部署卡在第一步。
            # 部署主機不該保留本機修改,直接對齊遠端才是正確語意。
            # .env.local 在 .gitignore 裡,不受 reset --hard 影響。

            # ── 為什麼要先備份 .next ──────────────────────────────
            # 2026-08-04 有一次 build 失敗，結果不是「部署沒成功」，是「網站掛了」：
            #   git reset --hard  → 原始碼換成新的
            #   npm run build     → 失敗，但 .next 已經被寫壞一半
            #   pm2 restart       → 沒跑到，舊程序繼續跑
            # 舊程序讀的是那份殘缺的 .next，每個請求都 Cannot find module '_error.js'，
            # 崩潰 → pm2 重啟 → 再崩潰，累積 79 次，全站 503 好幾個小時。
            # 而 Actions 上只顯示「部署失敗」，沒有人會聯想到網站已經死了。
            #
            # 所以：先留一份能跑的 .next 和目前的 commit，失敗就整組還原。
            # 部署失敗應該等於「什麼都沒發生」，不該等於「網站掛掉」。
            PREV_SHA=$(git rev-parse HEAD)
            rm -rf .next.bak
            [ -d .next ] && cp -a .next .next.bak

            rollback() {
              echo "!! 部署失敗，還原到 $PREV_SHA"
              git reset --hard "$PREV_SHA"
              rm -rf .next
              [ -d .next.bak ] && mv .next.bak .next
              pm2 restart anxing || true
              exit 1
            }

            git fetch origin main
            git reset --hard origin/main
            npm install --no-audit --no-fund || rollback

            # 一定要從乾淨的 .next 開始 build。
            #
            # 之前是直接蓋著上一版的 .next 增量 build。快幾秒，但只要有一個
            # 產物沒被重新產生，後面的階段就會去讀一個「上一版留下來的」或
            # 「這一版根本沒生出來的」檔案，錯誤訊息會指向一個跟改動無關的路由。
            # #218 的 ENOENT .nft.json 就是那種形狀的錯。
            #
            # 備份在上面已經做好了（.next.bak），失敗照樣還原得回去。
            rm -rf .next
            npm run build || rollback

            pm2 restart anxing || pm2 start npm --name anxing -- start

            # ── build 成功不等於服務活著 ──────────────────────────
            # 上面那次事故裡，build 之外的每一個訊號都是綠的：
            # pm2 顯示 online、log 印著 ✓ Ready in 898ms、CI 也綠。
            # 所以這裡實際打一次 API，確認它真的回得出 200 才算部署完成。
            # 給 30 秒，next start 通常一秒內就緒，慢的是第一次的路由編譯。
            echo "-- 健康檢查 --"
            OK=0
            CODE=000
            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3001/api/health || echo 000)
              if [ "$CODE" = "200" ]; then OK=1; echo "健康檢查通過（第 ${i} 次嘗試）"; break; fi
              sleep 2
            done

            if [ "$OK" != "1" ]; then
              echo "!! 服務起來了但健康檢查沒過（最後狀態碼 $CODE）"
              pm2 logs anxing --lines 40 --nostream || true
              rollback
            fi

            rm -rf .next.bak
            echo "部署完成：$(git rev-parse --short HEAD)"
