# ══════════════════════════════════════════════════════════════
# 每日資料庫備份
# ══════════════════════════════════════════════════════════════
#
# 2026-08-31 使用者：「可以備份資料庫 到 github 或是我地端」「每天，留 30 天」
#
# 這一支負責雲端那一半（GitHub）。本機那一半是 `scripts/backup-db.ps1`。
# 兩份都做的理由:GitHub 帳號出事的時候,備份跟程式碼會一起沒。
#
# ══════════════════════════════════════════════════════════════
# 【★★★ 跑之前一定要確認 repo 是 private】
#
#   artifact 的下載權限**跟 repo 一樣**。
#   repo 是 public 的話,任何人點一下就下載到整個資料庫 ——
#   房客姓名、電話、租金、銀行帳號、員工薪資,全部。
#
#   而那**不會有任何警告**。GitHub 不會問「你確定要公開資料庫嗎」,
#   它只是照 repo 的設定給人下載。
#
#   確認方式:repo 首頁標題旁邊要有一個灰色的「Private」標籤。
#
# ══════════════════════════════════════════════════════════════
# 【要先設定的 Secret：只有一個】
#
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:   SUPABASE_DB_URL
#     Secret: postgresql://postgres.[專案代號]:[資料庫密碼]@aws-0-[區域].pooler.supabase.com:5432/postgres
#
#   去哪拿:Supabase Dashboard → 右上角 Connect → Session pooler 那一段。
#   密碼忘了就去 Database Settings 重設（重設之後這裡也要跟著改）。
#
#   ★★ 這串字裡面**有資料庫密碼**。不要貼進 issue、不要貼進 commit、
#     也不要傳給任何人（包含我）—— 它等於整個資料庫的鑰匙。
#
# ══════════════════════════════════════════════════════════════
# 【為什麼用 Supabase CLI 而不是直接 pg_dump】
#
#   Supabase 的資料庫裡有一堆**它自己管的 schema**（auth、storage、
#   extensions 建的那些）。直接 pg_dump 全部撈下來的話,還原時會撞上
#   「permission denied for schema auth」之類的錯誤 ——
#   那些東西新專案本來就有,不該由備份帶進去。
#
#   `supabase db dump` 知道要排除哪些,這是它唯一但關鍵的價值。
#
# ══════════════════════════════════════════════════════════════

name: 每日資料庫備份

on:
  schedule:
    # ★ cron 是 UTC。台灣時間 04:00 = UTC 20:00（前一天）。
    #   選凌晨是因為那時沒有人在操作 —— 備份到一半有人在改資料的話，
    #   三個檔案（roles / schema / data）之間會對不起來。
    - cron: '0 20 * * *'
  # ★ 手動也要能跑。只有排程的話，「我現在想要一份」就得等到明天，
  #   而想備份的時刻通常正是「等一下要做一件危險的事」。
  workflow_dispatch:

# ★ 一次只准跑一個（跟 deploy.yml 同一個理由）。
#   手動按下去時剛好排程也在跑的話，兩個 job 會同時對資料庫拉全量資料。
concurrency:
  group: backup-db
  cancel-in-progress: false

# ★ 這支不需要寫入任何東西 —— 權限給到最小。
#   預設的 GITHUB_TOKEN 有寫入權限,而備份用不到。
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # ★ 30 分鐘沒跑完就砍掉。沒有這一行的話，卡住的 job 會跑滿六小時，
    #   而那六小時裡每天的排程還在往上疊。
    timeout-minutes: 30

    steps:
      # ══════════════════════════════════════════════════════
      # ★★★ 用 pg_dump，**不用 Supabase CLI**（2026-08-31 換掉）
      #
      #   第一版用 `supabase db dump`，跑完是綠的、檔案也產生了，
      #   但 roles.sql 只有 297 bytes、data.sql 裡一張業務表都沒有 ——
      #   **它成功地備份了空氣**。
      #
      #   ★ 而本機那支用同一個資料庫、同一串連線字串，
      #     plain pg_dump 抓出 11.92 MB。所以問題不在資料庫也不在連線，
      #     在那個工具。
      #
      #   ★★ 換成跟本機**一模一樣的做法**:同一支 pg_dump、同一組參數。
      #     兩邊一致的價值不只是少一種工具 —— 是「本機測得過的東西，
      #     雲端就一定跑得過」。工具不同的話，本機驗證證明不了雲端。
      #
      #   代價:pg_dump 不會自動排除 Supabase 管的 schema，所以改成
      #   明確指定要哪幾個（見下面 --schema 那幾行）。
      # ══════════════════════════════════════════════════════
      - name: 匯出
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          # ★★ Secret 沒設的話要**明白地講**。
          #   不擋的話 pg_dump 會拿空字串去連,錯誤訊息看起來像密碼打錯,
          #   而真正的原因是根本沒有那個 Secret。
          if [ -z "${DB_URL}" ]; then
            echo "::error::找不到 SUPABASE_DB_URL 這個 Secret。"
            echo "::error::請到 Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi

          mkdir -p out

          # ★ 用 Docker 跑 pg_dump，版本自己指定。
          #   runner 內建的 pg_dump 版本會隨 image 改變,而
          #   「pg_dump 比伺服器舊」的症狀是 server version mismatch ——
          #   那會在某一次 runner 更新後突然開始發生,而沒有人動過這個檔案。
          #   釘死版本就不會有那一天。18 對任何 ≤18 的伺服器都可以。
          PG='docker run --rm -i postgres:18-alpine pg_dump'

          # ── 1. 結構 ＋ 資料（一份）──────────────
          #
          # ★ 跟本機那支同一組參數。
          #   `--schema=public`             我們自己的表:訂單、支出、流水、契約…
          #   `--schema=supabase_migrations` migration 的執行紀錄
          #   `--no-owner`                   不要帶 supabase_admin 那些擁有者資訊,
          #   ★ 2026-10-20 起**保留權限**（拿掉 --no-privileges）：
          #     Supabase 10/30 起新表不再自動開放，沒帶 grant 的備份還原後整站讀不到；
          #     而且 app_secrets 那種刻意 revoke 的表，不帶權限還原會變成人人讀得到。
          #     grant 的對象（anon／authenticated／service_role）每個 Supabase 專案都有。
          #  （舊說明：
          #                                  帶著的話還原到新專案會一路噴 role does not exist
          echo "→ public ＋ supabase_migrations"
          $PG "$DB_URL" \
            --no-owner \
            --schema=public --schema=supabase_migrations \
            --quote-all-identifiers \
            > out/anxing.sql

          # ── 2. 登入帳號（盡力而為）──────────────
          #
          # ★★ auth schema 是 Supabase 管的,pg_dump 抓得到但**權限可能不足**。
          #   抓得到就多一份保險;抓不到**不讓整個備份失敗** ——
          #   員工帳號重新邀請就有了,而訂單與流水沒有第二個來源。
          #
          # ★ 主次要分清楚:一份「大部分成功」的備份，
          #   遠好過一份「因為次要項目失敗而根本不存在」的備份。
          echo "→ auth（抓不到不算失敗）"
          if $PG "$DB_URL" --no-owner --no-privileges \
               --schema=auth --data-only --quote-all-identifiers \
               > out/auth.sql 2>out/auth.err; then
            echo "  auth 也抓到了"
          else
            echo "::warning::auth schema 抓不到（權限不足）—— 員工登入帳號沒有備份到，其餘不受影響"
            echo "-- auth schema 匯出失敗，原因：" > out/auth.sql
            cat out/auth.err >> out/auth.sql
          fi
          rm -f out/auth.err

          # ══════════════════════════════════════════
          # ★★★ 檢查備份不是空的
          #
          #   2026-08-31 這一段**真的擋下了一次空備份**（第一版用 Supabase CLI
          #   那次）。工具回 0、檔案也產生了、artifact 也會上傳成功 ——
          #   而三十天後你要用它的時候才發現裡面什麼都沒有。
          #
          #   **沒有驗證的備份不算備份。**
          # ══════════════════════════════════════════
          fail=0
          size=$(stat -c%s out/anxing.sql)
          echo "  anxing.sql = $((size / 1024)) KB"
          # ★ 門檻抓 1 MB。本機那份是 11.92 MB,真的壞掉時是幾百 bytes ——
          #   中間差兩個數量級,不會誤判。
          if [ "$size" -lt 1000000 ]; then
            echo "::error::anxing.sql 只有 ${size} bytes —— 本機那份是 11.9 MB，這不像是真的備份"
            fail=1
          fi

          # ★ 檔案夠大但內容是別的東西也是壞的備份,所以要點名四張主表。
          #   ★★ 找 `COPY "public"."xxx"` 而不是只找表名 ——
          #     只找表名的話,schema 定義裡的一行 CREATE TABLE 就會讓檢查過關,
          #     而那份備份裡一列資料都沒有。要驗的是**資料**在不在。
          for t in bank_transactions orders expenses contracts; do
            if ! grep -q "COPY \"public\".\"${t}\"" out/anxing.sql; then
              echo "::error::anxing.sql 裡找不到 ${t} 的資料（COPY 那一段）"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          # ══════════════════════════════════════════
          # ★★ 還原前要先跑的那幾行（2026-10-20 還原演練抓到的）
          #   備份只有 public 那一層，**擴充套件不在裡面**。沒有先裝的話：
          #     · 3 條「不能重疊」的規則（物業負責人任期、請假、加班）建不起來 → 之後會重複
          #     · 清潔備註的模糊搜尋索引建不起來
          #   而且還原過程只會印一行 ERROR、不會停 —— 很容易沒看到。
          # ══════════════════════════════════════════
          cat > out/restore-prelude.sql <<'SQL'
          -- 還原步驟（新的、空的 Supabase 專案；用 psql 18，不能貼 SQL Editor）
          --   1. psql "$新專案連線" -f restore-prelude.sql        ← 這一份：先裝擴充
          --   2. psql "$新專案連線" -f auth.sql                    ← 員工登入帳號（要在 3 之前，不然好幾張表的關聯建不起來）
          --   3. psql "$新專案連線" -f anxing.sql                  ← 資料（「schema public already exists」那一行錯誤可以忽略）
          --   4. storage.tar 解開，照 manifest.csv 上傳回各 bucket
          create extension if not exists pg_trgm with schema public;
          create extension if not exists btree_gist with schema extensions;
          create extension if not exists pg_net;
          SQL

          # 壓縮。SQL 是純文字，壓縮率很高（通常剩十分之一）。
          gzip -9 out/anxing.sql out/auth.sql
          echo "── 備份完成 ──"
          ls -lh out/

      - name: 上傳（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          # ★ 檔名帶日期。全部叫 backup 的話，
          #   下載三份下來會變成 backup(1).zip、backup(2).zip，分不出誰是誰。
          name: db-backup-${{ github.run_id }}
          path: out/
          # ★ 使用者指定 30 天。GitHub 上限 90 天。
          #   到期會自動刪 —— 不用手動清，也不會無限長大。
          retention-days: 30
          # ★ 檔案不見時要**失敗**,不要靜靜上傳一個空的 artifact。
          if-no-files-found: error
          compression-level: 0  # 已經 gzip 過了，再壓一次只是浪費時間

      # ══════════════════════════════════════════════════════
      # ★★ 檔案備份（2026-10-20 David：「GitHub 自動備份含圖片」）
      #
      #   資料庫裡只存了圖片的**路徑**，檔案本身在 Supabase Storage ——
      #   沒有這一段的話，還原回來的憑證、佈告欄附件、報表、社群圖片全部是破圖。
      #
      #   做法：從資料庫撈 storage.objects 的清單（每個檔案的 bucket、路徑、大小），
      #   用 service key 逐一下載，**大小一個一個對**，有任何一個沒下載到就整步失敗（紅燈）。
      #
      #   ★ 放在資料庫那份上傳之後 —— 這一步失敗時，資料庫備份照樣已經存好了。
      #   ★ 要兩個 Secret（數值跟主機上的 .env 一樣，不要貼給任何人）：
      #       SUPABASE_URL          ＝ NEXT_PUBLIC_SUPABASE_URL 那一串
      #       SUPABASE_SERVICE_KEY  ＝ SUPABASE_SERVICE_KEY 那一串
      #   ★ 保留 7 天不是 30 天：GitHub 免費方案 artifact 總共 500 MB，
      #     圖片每天一整份、留 30 天會超過。長期保存靠電腦那份（fetch-backup.ps1 留 30 天）。
      # ══════════════════════════════════════════════════════
      - name: 檔案（憑證圖片、佈告欄、報表、社群）
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SB_URL}" ] || [ -z "${SB_KEY}" ]; then
            echo "::error::找不到 SUPABASE_URL／SUPABASE_SERVICE_KEY 這兩個 Secret —— 檔案沒有備份到（資料庫那份已經存好了）"
            exit 1
          fi
          mkdir -p files/objects out-files
          docker run --rm -i postgres:18-alpine psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c \
            "\copy (select bucket_id, name, coalesce((metadata->>'size')::bigint, -1) from storage.objects where name not like '%.emptyFolderPlaceholder' order by 1, 2) to stdout with (format csv)" \
            > files/manifest.csv
          python3 - files/manifest.csv files/objects <<'PY'
          import csv, os, sys, collections, urllib.request, urllib.parse, concurrent.futures as cf
          man, dest = sys.argv[1], sys.argv[2]
          base, key = os.environ['SB_URL'].rstrip('/'), os.environ['SB_KEY']
          rows = list(csv.reader(open(man, encoding='utf-8')))
          def get(r):
              b, name, size = r[0], r[1], int(r[2])
              if '..' in name.split('/'):
                  return f'{b}/{name}: 路徑不正常，跳過'
              url = f"{base}/storage/v1/object/{urllib.parse.quote(b)}/{urllib.parse.quote(name)}"
              # 舊的 service_role（eyJ…）放兩個標頭；新的 secret key（sb_secret_…）只放 apikey —— 兩種都能用
              hdr = {'apikey': key} if key.startswith('sb_') else {'Authorization': f'Bearer {key}', 'apikey': key}
              req = urllib.request.Request(url, headers=hdr)
              p = os.path.join(dest, b, *name.split('/'))
              os.makedirs(os.path.dirname(p), exist_ok=True)
              err = None
              for _ in range(3):
                  try:
                      n = 0
                      with urllib.request.urlopen(req, timeout=120) as resp, open(p, 'wb') as f:
                          while True:
                              chunk = resp.read(1 << 16)
                              if not chunk:
                                  break
                              f.write(chunk); n += len(chunk)
                      if size >= 0 and n != size:
                          raise IOError(f'大小 {n} ≠ 清單上的 {size}')
                      return None
                  except Exception as e:
                      err = e
              return f'{b}/{name}: {err}'
          with cf.ThreadPoolExecutor(8) as ex:
              errs = [e for e in ex.map(get, rows) if e]
          by = collections.Counter(r[0] for r in rows)
          mb = sum(max(int(r[2]), 0) for r in rows) / 1048576
          print(f'清單 {len(rows)} 個檔案、{mb:.1f} MB；下載失敗 {len(errs)} 個')
          for b, n in sorted(by.items()):
              print(f'  {b}: {n} 個')
          for e in errs[:30]:
              print('::error::' + e)
          sys.exit(1 if errs else 0)
          PY
          # 圖片本來就壓縮過，tar 不再 gzip
          tar -cf out-files/storage.tar -C files .
          ls -lh out-files/

      - name: 上傳檔案備份（保留 7 天）
        uses: actions/upload-artifact@v4
        with:
          name: files-backup-${{ github.run_id }}
          path: out-files/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
